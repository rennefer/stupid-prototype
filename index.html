<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none}
#player{position:absolute;z-index:90;font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic","Arial Unicode MS",serif;color:#302718;font-size:72px;line-height:1;pointer-events:none;transform-origin:center bottom}
.item,.npc{position:absolute;z-index:80;cursor:pointer;font-family:"Noto Sans Egyptian Hieroglyphs","Segoe UI Historic","Arial Unicode MS",serif;color:#302718}
.item{font-size:62px}.npc{font-size:44px}
.bubble{display:none;position:absolute;z-index:120;max-width:230px;background:#f8efd9;border:2px solid #6d5220;border-radius:16px;padding:10px 13px;font:15px Georgia,serif;color:#4b3817}
.npc.active + .bubble{display:block}
#hud{position:absolute;left:18px;top:18px;z-index:130;background:#f8efd9e8;border:1px solid #8a6b31;border-radius:10px;padding:9px 12px;font:15px Georgia,serif;color:#4b3817}
#victory,#complete{display:none;position:absolute;inset:0;z-index:200;background:#f4ead4ee;align-items:center;justify-content:center;text-align:center;color:#302718}
.panel{font:24px Georgia,serif;padding:30px}.big{font-size:72px;margin-bottom:12px}
.next{font:18px Georgia,serif;padding:10px 20px;border:1px solid #6d5220;background:#f8efd9;border-radius:10px;cursor:pointer;color:#4b3817}
</style>
</head>
<body>
<div id="game">
<img id="scene" src="level1.png" alt="">
<div id="hud">Level <b id="levelNo">1</b> · <b id="levelName">The River Retreat</b> · Found: <b id="found">0</b>/5</div>
<div id="world"></div>
<div id="player">𓀁</div>
<div id="victory"><div class="panel"><div class="big">𓆣 𓋹 𓂀</div><div id="victoryText">Level complete</div><p><button class="next" id="nextBtn">Next level</button></p></div></div>
<div id="complete"><div class="panel"><div class="big">𓋹 𓂀 𓆣 𓅃</div><div>All four levels complete.</div><p>You found every hidden item.</p></div></div>
</div>
<script>
const scene=document.getElementById("scene"),world=document.getElementById("world"),player=document.getElementById("player");
const foundEl=document.getElementById("found"),levelNo=document.getElementById("levelNo"),levelName=document.getElementById("levelName");
const victory=document.getElementById("victory"),complete=document.getElementById("complete"),victoryText=document.getElementById("victoryText"),nextBtn=document.getElementById("nextBtn");
const keys={}; let level=0,x=50,y=72,found=0,frame=0;

const levels=[
 {name:"The River Retreat",bg:"level1.png",items:[["𓅃",21,29],["𓅃",40,18],["𓅃",63,30],["𓅃",77,21],["𓅃",91,50]],hints:[[8,38,"Look among the reeds and near the gentle river."],[58,45,"One is hidden high among the plants."],[81,58,"Search around the palms."],[43,68,"Look above the river bank."]]},
 {name:"The Desert Path",bg:"level2.png",items:[["𓋹",16,55],["𓂀",33,24],["𓆣",49,58],["𓊝",70,61],["𓎟",87,42]],hints:[[8,38,"Search the sands near the western ruins."],[58,45,"Look around the tall temple."],[81,58,"Follow the path toward the palm."],[43,68,"Search beside the columns."]]},
 {name:"The Temple Gardens",bg:"level3.png",items:[["𓆣",17,63],["𓋹",34,23],["𓂀",53,66],["𓇼",73,49],["𓍿",91,63]],hints:[[8,38,"Look within the gardens."],[58,45,"Search around the upper temple."],[81,58,"A treasure rests beside the water."],[43,68,"Check the high garden path."]]},
 {name:"The Sacred Peak",bg:"level4.png",items:[["𓇼",20,48],["𓂀",36,58],["𓋹",55,35],["𓆣",74,55],["𓍿",90,45]],hints:[[8,38,"Search the lower western slope."],[58,45,"Look high on the sacred peak."],[81,58,"Search beside the palms and rocks."],[43,68,"The final item is near the summit path."]]}
];

const zones=[[4,58,30,25],[14,43,34,18],[27,48,23,18],[40,57,28,18],[50,43,34,25],[68,52,29,22],[25,32,14,16],[58,30,20,18],[0,75,100,10]];

function clearWorld(){world.innerHTML=""}
function addItem(sign,px,py){
 const e=document.createElement("div");e.className="item";e.textContent=sign;e.style.left=px+"%";e.style.top=py+"%";world.appendChild(e)
}
function addNpc(px,py,text){
 const n=document.createElement("div");n.className="npc";n.textContent="𓀀";n.style.left=px+"%";n.style.top=py+"%";
 const b=document.createElement("div");b.className="bubble";b.textContent=text;b.style.left=Math.min(82,px+2)+"%";b.style.top=Math.max(8,py-10)+"%";
 n.onclick=()=>{document.querySelectorAll(".npc.active").forEach(a=>a.classList.remove("active"));n.classList.toggle("active")};
 world.append(n,b)
}
function loadLevel(i){
 level=i;found=0;x=50;y=72;frame=0;clearWorld();
 const L=levels[level];scene.src=L.bg;levelNo.textContent=level+1;levelName.textContent=L.name;foundEl.textContent=0;
 L.items.forEach(a=>addItem(a[0],a[1],a[2]));L.hints.forEach(a=>addNpc(a[0],a[1],a[2]));
 victory.style.display="none";complete.style.display="none";render()
}
function depthScale(){const t=(98-y)/(98-3);return 1-.58*t}
function render(){player.style.left=x+"%";player.style.top=y+"%";player.style.transform=`translate(-50%,-100%) scale(${depthScale()})`}
function inZone(px,py){return zones.some(z=>px>=z[0]&&px<=z[0]+z[2]&&py>=z[1]&&py<=z[1]+z[3])}
function move(dx,dy){
 const nx=Math.max(1,Math.min(99,x+dx)),ny=Math.max(3,Math.min(98,y+dy));
 if(inZone(nx,ny)){x=nx;y=ny;return}
 if(Math.hypot(nx-x,ny-y)<=2*depthScale()){x=nx;y=ny}
}
function animate(moving){if(!moving){player.textContent="𓀁";return}frame++;player.textContent=(Math.floor(frame/7)%2===0)?"𓀁":"𓀂"}
function collect(){
 const p=player.getBoundingClientRect();
 document.querySelectorAll(".item").forEach(e=>{if(e.dataset.found)return;const r=e.getBoundingClientRect();
 if(p.left<r.right&&p.right>r.left&&p.top<r.bottom&&p.bottom>r.top){e.dataset.found="1";e.style.visibility="hidden";found++;foundEl.textContent=found;if(found===5)showVictory()}})
}
function showVictory(){victoryText.textContent=level===3?"All four levels complete!":`Level ${level+1} complete — ${levels[level].name}`;nextBtn.textContent=level===3?"Finish":"Next level";victory.style.display="flex"}
nextBtn.onclick=()=>{if(level===3){victory.style.display="none";complete.style.display="flex"}else loadLevel(level+1)}
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowleft","arrowright","arrowup","arrowdown"].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function loop(){let dx=0,dy=0;if(keys.a||keys.arrowleft)dx-=.42;if(keys.d||keys.arrowright)dx+=.42;if(keys.w||keys.arrowup)dy-=.42;if(keys.s||keys.arrowdown)dy+=.42;const moving=!!(dx||dy);if(moving)move(dx,dy);animate(moving);render();collect();requestAnimationFrame(loop)}
loadLevel(0);loop();
</script>
</body>
</html>
